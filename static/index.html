<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReplyDesk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <header class="page-head">
      <span class="tag">HUMAN-IN-THE-LOOP</span>
      <h1>AI drafts the reply. You decide what gets sent.</h1>
    </header>

    <section class="card" id="composeCard">
      <label for="customerMessage">Customer message</label>
      <textarea id="customerMessage" rows="5" maxlength="4000" placeholder="Paste the customer's email or chat message here..."></textarea>

      <fieldset class="tones">
        <legend>Tone</legend>
        <label><input type="radio" name="tone" value="Friendly" checked><span>Friendly</span></label>
        <label><input type="radio" name="tone" value="Formal"><span>Formal</span></label>
        <label><input type="radio" name="tone" value="Apologetic"><span>Apologetic</span></label>
        <label><input type="radio" name="tone" value="Concise"><span>Concise</span></label>
      </fieldset>

      <button id="startBtn" class="btn primary">Draft reply</button>
    </section>

    <section class="card" id="reviewCard" hidden>
      <div class="review-head">
        <h2>Draft for your review</h2>
        <div class="attempt">
          <span id="attemptLabel"></span>
          <span class="steps" id="steps" aria-hidden="true"></span>
        </div>
      </div>

      <div class="draft" id="draft"></div>

      <div id="actions">
        <p class="last-note" id="lastNote" hidden>This is the final round. Approve it, or finish and keep this draft unapproved.</p>
        <label for="feedback">Feedback for a rewrite</label>
        <textarea id="feedback" rows="3" maxlength="2000" placeholder="e.g. Shorter, less formal, mention the refund timeline placeholder..."></textarea>
        <div class="btn-row">
          <button id="approveBtn" class="btn primary">Approve</button>
          <button id="reviseBtn" class="btn ghost">Request rewrite</button>
        </div>
      </div>

      <div class="banner" id="banner" hidden>
        <p id="bannerText"></p>
        <div class="btn-row">
          <button id="copyBtn" class="btn primary">Copy reply</button>
          <button id="resetBtn" class="btn ghost">New reply</button>
        </div>
      </div>
    </section>

    <p id="errorMsg" class="error" role="alert"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
