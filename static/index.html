<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReplyDesk - AI Drafts. You Decide.</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="dark-theme">
    <!-- Ambient Dynamic Background Animation -->
    <div class="bg-canvas-wrapper">
        <canvas id="bg-network-canvas"></canvas>
        <div class="glow-orb orb-cyan"></div>
        <div class="glow-orb orb-blue"></div>
    </div>

    <div class="app-container">
        <!-- Header Controls Bar -->
        <header class="app-header">
            <div class="brand-tag">
                <span class="tag-label">HUMAN-IN-THE-LOOP</span>
            </div>
            <!-- Dev Options Toggle Switches (Default OFF) -->
            <div class="toggle-controls">
                <label class="toggle-switch" title="Toggle State Inspector">
                    <input type="checkbox" id="toggle-state-inspector">
                    <span class="slider"></span>
                    <span class="toggle-label"><i class="fa-solid fa-code"></i> State Inspector</span>
                </label>
                <label class="toggle-switch" title="Toggle Execution Logs">
                    <input type="checkbox" id="toggle-logs">
                    <span class="slider"></span>
                    <span class="toggle-label"><i class="fa-solid fa-terminal"></i> Console Logs</span>
                </label>
            </div>
        </header>

        <!-- Main Heading -->
        <h1 class="main-title">AI drafts the reply. You decide what gets sent.</h1>

        <!-- Main Layout Grid -->
        <div class="pipeline-layout-grid" id="main-layout-grid">
            <!-- Left Side: Interactive Input & Draft Card -->
            <div class="cards-layout-column">
                <section class="hitl-card">
                    <div class="card-glow-bg"></div>
                    
                    <!-- Customer Message Input -->
                    <div class="input-group">
                        <label class="input-label" for="customer-message">Customer message</label>
                        <div class="textarea-container">
                            <textarea id="customer-message" rows="4" placeholder="Paste the customer's email or chat message here..."></textarea>
                        </div>
                    </div>

                    <!-- Tone Selection Pills -->
                    <div class="tone-section">
                        <label class="input-label">Tone</label>
                        <div class="tone-pills-group" id="tone-pills">
                            <button class="tone-pill active" data-tone="Friendly">Friendly</button>
                            <button class="tone-pill" data-tone="Formal">Formal</button>
                            <button class="tone-pill" data-tone="Apologetic">Apologetic</button>
                            <button class="tone-pill" data-tone="Concise">Concise</button>
                        </div>
                    </div>

                    <!-- Action Button -->
                    <div class="action-group">
                        <button id="draft-reply-btn" class="cyan-btn">
                            <i class="fa-solid fa-wand-magic-sparkles"></i> Draft reply
                        </button>
                    </div>

                    <!-- Generated Reply Preview Box -->
                    <div class="reply-output-box hidden" id="reply-output-box">
                        <div class="reply-header">
                            <span class="reply-tag"><i class="fa-solid fa-robot"></i> Generated AI Draft</span>
                            <span class="tone-badge" id="active-tone-badge">Friendly Tone</span>
                        </div>
                        <div class="reply-content" id="draft-reply-text" contenteditable="true">
                            Generating response...
                        </div>
                        <div class="reply-actions">
                            <button class="action-btn approve-btn" id="approve-btn"><i class="fa-solid fa-check"></i> Approve & Send</button>
                            <button class="action-btn regenerate-btn" id="regenerate-btn"><i class="fa-solid fa-rotate"></i> Regenerate</button>
                        </div>
                    </div>
                </section>
            </div>

            <!-- Right Side Dev Panels (Hidden by default, shown when toggled ON) -->
            <div class="dev-panels-column hidden" id="dev-panels-column">
                <!-- State Inspector Card -->
                <div class="dev-card hidden" id="state-inspector-card">
                    <div class="dev-card-header">
                        <h4><i class="fa-solid fa-code"></i> State Inspector Payload</h4>
                    </div>
                    <div class="dev-card-body">
                        <pre><code id="state-json-viewer">// State Inspector active. Draft a reply to inspect payload.</code></pre>
                    </div>
                </div>

                <!-- Console Logs Card -->
                <div class="dev-card hidden" id="logs-card">
                    <div class="dev-card-header">
                        <h4><i class="fa-solid fa-list-check"></i> Execution Logs</h4>
                        <button class="icon-btn" id="clear-logs-btn" title="Clear Logs"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                    <div class="dev-card-body logs-body" id="logs-container">
                        <div class="log-entry sys"><span class="ts">[00:00:00]</span> Human-in-the-Loop engine initialized.</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
